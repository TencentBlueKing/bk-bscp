name: build
on: [push, pull_request]
jobs:
  build-bscp:
    name: build-bscp
    runs-on: ubuntu-latest
    steps:
      # 拉取代码
      - name: checkout
        uses: actions/checkout@v4

      # 设置 Go 环境
      - name: setup go
        uses: actions/setup-go@v3
        with:
          go-version-file: go.mod

      # embed.go 引用了 ui/dist 与 ui_old/dist，创建占位文件使编译通过
      - name: create ui dist placeholders
        run: |
          mkdir -p ui/dist ui_old/dist
          echo '{}' > ui/dist/config.json
          echo '{}' > ui_old/dist/config.json
          touch ui/dist/index.html ui/dist/403.html
          touch ui_old/dist/index.html ui_old/dist/403.html

      # 编译项目
      - name: build go project
        run: |
          make build_bscp

  build-ui:
    name: build-ui
    runs-on: ubuntu-latest
    steps:
      # 拉取代码
      - name: checkout
        uses: actions/checkout@v4

      # 固定已修复 CVE-2026-111497 的 Node.js 版本
      - name: setup node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.4'

      # 设置 Go 环境
      - name: setup go
        uses: actions/setup-go@v3
        with:
          go-version-file: go.mod

      # 只构建新 UI。旧 UI 不再发布，不在这里执行 ui_old 的 npm 构建。
      - name: build ui project
        run: |
          make build_frontend_new
