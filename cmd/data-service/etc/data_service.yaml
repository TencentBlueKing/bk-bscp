# defines all the network related options.
network:
  # bindIP is ip where server working on.
  bindIP:
  # rpcPort is port where server listen to rpc port.
  rpcPort: 9511
  # httpPort is port where server listen to http port.
  httpPort: 9611
  # defines tls related options.
  tls:
    # server should be accessed without verifying the TLS certificate.
    insecureSkipVerify: 
    # server requires TLS client certificate authentication.
    certFile:
    # server requires TLS client certificate authentication.
    keyFile:
    # trusted root certificates for server.
    caFile:
    # the password to decrypt the certificate.
    password:

# defines esb related settings.
esb:
  # endpoints is a seed list of host:port addresses of esb nodes.
  endpoints:
    - http://127.0.0.1:12345
  # appCode is the blueking app code of bscp to request esb.
  appCode: bk-bscp
  # appSecret is the blueking app secret of bscp to request esb.
  appSecret: xxxx
  # user is the blueking user of bscp to request esb.
  user: admin
  # defines tls related options.
  tls:
    # server should be accessed without verifying the TLS certificate.
    insecureSkipVerify: 
    # server requires TLS client certificate authentication.
    certFile:
    # server requires TLS client certificate authentication.
    keyFile:
    # trusted root certificates for server.
    caFile:
    # the password to decrypt the certificate.
    password:

# defines service related settings.
service:
  # defines etcd related settings
  etcd:
    # endpoints is a list of URLs.
    endpoints:
      - 127.0.0.1:2379
    # dialTimeoutMS is the timeout milliseconds for failing to establish a connection.
    dialTimeoutMS:
    # username is a user's name for authentication.
    username:
    # password is a password for authentication.
    password:
    # defines tls related options.
    tls:
      # server should be accessed without verifying the TLS certificate.
      insecureSkipVerify: 
      # server requires TLS client certificate authentication.
      certFile:
      # server requires TLS client certificate authentication.
      keyFile:
      # trusted root certificates for server.
      caFile:
      # the password to decrypt the certificate.
      password:

# defines sharding related settings.
sharding:
  # defines database related settings.
  adminDatabase:
    # is a seed list of host:port addresses of database nodes.
    endpoints:
      - 127.0.0.1:3306
    database: bk_bscp_admin
    user: root
    password: admin
    # DialTimeoutSec is timeout in seconds to wait for a response from the db server
    # all the timeout default value reference:
    # https://dev.mysql.com/doc/refman/8.0/en/server-system-variables.html.
    dialTimeoutSec:
    readTimeoutSec:
    writeTimeoutSec:
    maxIdleTimeoutMin:
    maxOpenConn:
    maxIdleConn:
    # defines tls related options.
    tls:
      # server should be accessed without verifying the TLS certificate.
      insecureSkipVerify: 
      # server requires TLS client certificate authentication.
      certFile:
      # server requires TLS client certificate authentication.
      keyFile:
      # trusted root certificates for server.
      caFile:
      # the password to decrypt the certificate.
      password:
  # maxSlowLogLatencyMS defines the max tolerance in millisecond to execute
  # the database command, if the cost time of execute have >= the maxSlowLogLatencyMS
  # then this request will be logged.
  maxSlowLogLatencyMS: 200
  # limiter limit the incoming request frequency to database for each sharding, and
  # each sharding have the independent request limitation.
  limiter:
    qps: 500
    burst: 500

# 特性配置
featureFlags:
  # 业务展示白名单
  BIZ_VIEW:
    # 全局默认配置(优先级低于业务级配置)，默认为true（展示）
    default:
    # 业务级配置，默认为空
    spec:
      "2":
  # 业务资源限制
  RESOURCE_LIMIT:
    # 全局默认配置(优先级低于业务级配置)
    default:
      # 配置文件大小上限，单位为MB，默认为100MB
      maxFileSize:
      # 单个app下允许创建的配置数（模版+非模版），默认为2000
      appConfigCnt:
      # 单个模版套餐下允许创建的模版数，默认为2000
      tmplSetTmplCnt:
    # 业务级配置，默认为空
    spec:
      "2":
        # 配置文件大小上限，单位为MB
        maxFileSize:
        # 单个app下允许创建的配置数（模版+非模版）
        appConfigCnt:
        # 单个模版套餐下允许创建的模版数
        tmplSetTmplCnt:

# defines log's related configuration
log:
  # log storage directory.
  logDir: ./log
  # per file max size, uint: MB.
  maxPerFileSizeMB: 1024
  # per line max size, uint: KB.
  maxPerLineSizeKB: 2
  # log file max storage number.
  maxFileNum: 5
  # whether the restart service log is appended to the latest log file, or whether a new log file is created.
  logAppend: false
  # log the log to std err only, it can not be used with AlsoToStdErr at the same time.
  toStdErr: false
  # log the log to file and also to std err. it can not be used with ToStdErr at the same time.
  alsoToStdErr: false
  # log level.
  verbosity: 0

# defines crontab task configuration
crontab:
  # sync business host task configuration
  syncBizHost:
    # whether the sync biz host task is enabled (default: true)
    enabled: true
    # sync business host relationships interval (default: 168h = 7 days)
    interval: 168h
    # QPS limit for sync biz host CMDB requests (default: 50.0)
    qpsLimit: 50.0
  # cleanup business host task configuration
  cleanupBizHost:
    # whether the cleanup biz host task is enabled (default: true)
    enabled: true
    # cleanup invalid business host relationships interval (default: 1h)
    interval: 1h
    # QPS limit for cleanup biz host CMDB requests (default: 50.0)
    qpsLimit: 50.0
  # watch business host relation task configuration
  watchBizHostRelation:
    # whether the watch biz host relation task is enabled (default: true)
    enabled: true
    # watch business host relationship changes interval (default: 1m)
    interval: 1m
    # QPS limit for watch biz host relation CMDB requests (default: 80.0)
    qpsLimit: 80.0
  # watch host updates task configuration
  watchHostUpdates:
    # whether the watch host updates task is enabled (default: true)
    enabled: true
    # watch host update events interval (default: 30s)
    interval: 30s
  # watch cmdb set/module/process resource task configuration
  # 采用常驻长轮询循环（CC resource_watch 短长链设计），CC 变更准实时推送
  watchCmdbResource:
    # 是否开启 CMDB 资源 watch 任务（默认 false）
    enabled: false
    # 租户/资源扫描周期，用于发现新租户或新资源、对账增减 watch 链（默认 1m）
    interval: 1m
    # 回退探测间隔，仅在 CC 未持有长轮询连接（响应耗时 < 1s）时生效，下限钳制为 1s（默认 1s）
    idleInterval: 1s
    # 对 CC 的并发 watch 请求数上限，即 CC watch 会话数上限（每个长轮询请求占用一个 CC 会话，最长 20s）（默认 8）
    maxConcurrency: 8
    # watch 请求 QPS 限制，主要用于收敛积压追平时的突发请求，须 >= 0（默认 20）
    qpsLimit: 20
    # 事件处理 worker 的跨资源并发数；同一资源的事件始终按 FIFO 顺序处理（默认 4）
    handlerConcurrency: 4
    # 游标丢失或过期时的回溯偏移量（默认 5m）
    startFromOffset: 5m
    # 单次长轮询 watch 请求超时，必须 > 20s（CC 持有窗口），校验不通过会在启动期报错（默认 35s）
    requestTimeout: 35s
    # 要 watch 的 CMDB 资源类型，仅允许 set/module/process，其它值启动期报错（默认 set/module/process）
    resources:
      - set
      - module
      - process
    # 按资源裁剪 bk_fields，可选；某资源缺省时回退到代码默认值，配空列表 [] 表示拉取全字段
    fields:
      set: ["bk_biz_id", "bk_set_id", "bk_set_name", "bk_set_env", "set_template_id"]
      module: ["bk_biz_id", "bk_set_id", "bk_module_id", "bk_module_name"]
    # 同时运行的 watch 链（租户×资源）上限；超限的链不会运行并告警，多租户场景需调大或减少 resources（默认 100）
    maxWatchChains: 100
    # 每批处理的最大事件数；页大小超过此值会被分块（CC 协议单页上限 200）（默认 200）
    maxEventsPerPage: 200
