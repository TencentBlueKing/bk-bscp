syntax = "proto3";

import "protoc-gen-openapiv2/options/annotations.proto";
import "google/protobuf/timestamp.proto";

package pbtb;

option go_package = "github.com/TencentBlueKing/bk-bscp/pkg/protocol/core/task_batch;pbtb";

// OperateRange 操作范围（gsekit 风格五段表达式，缺省段为 "*"）
message OperateRange {
  string set_name = 1 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = { description: "集群名称表达式" }];
  string module_name = 2
      [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = { description: "模块名称表达式" }];
  string service_name = 3
      [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = { description: "服务实例名称表达式" }];
  string process_alias = 4
      [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = { description: "进程别名表达式" }];
  string process_id = 5
      [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = { description: "CC进程ID表达式" }];
}

// ProcessTaskData 进程任务数据
message ProcessTaskData {
  string environment = 1 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = { description: "环境" }];
  OperateRange operate_range = 2
      [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = { description: "操作范围" }];
}

// TaskBatch represents a batch task execution record
message TaskBatch {
  uint32 id = 1 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = { description: "任务批次ID" }];
  string task_object = 2 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = { description: "任务对象" }];
  string task_action = 3 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = { description: "任务动作" }];
  ProcessTaskData task_data = 4
      [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = { description: "任务数据" }];
  string status = 5 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = { description: "任务状态" }];
  float execution_time = 6
      [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = { description: "执行耗时(秒)" }];
  google.protobuf.Timestamp start_at = 7
      [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = { description: "开始时间" }];
  google.protobuf.Timestamp end_at = 8
      [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = { description: "结束时间" }];
  string creator = 9 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = { description: "创建人" }];
}

// TaskPayload 任务的配置快照
message TaskPayload {
  string set_name = 1 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = { description: "集群名" }];
  string module_name = 2 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = { description: "模块名" }];
  string service_name = 3 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = { description: "服务实例" }];
  string environment = 4 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = { description: "环境" }];
  string alias = 5 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = { description: "进程别名" }];
  string inner_ip = 6 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = { description: "IP" }];
  string agent_id = 7 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = { description: "Agent ID" }];
  uint32 cc_process_id = 8 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = { description: "CC进程ID" }];
  uint32 host_inst_seq = 9
      [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = { description: "主机级别的序号" }];
  uint32 module_inst_seq = 10
      [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = { description: "模块级别的序号" }];
  string config_data = 11
      [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = { description: "进程启动相关配置" }];
  string func_name = 12
      [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = { description: "进程二进制文件名" }];
  // 改造前产生的历史任务不带该字段，此处用 optional 区分「优先级为 0」与「取不到优先级」
  optional int32 priority = 13
      [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = { description: "进程启动优先级" }];
}

// TaskDetail 任务详情
message TaskDetail {
  string task_id = 1 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = { description: "任务详情ID" }];
  string status = 2 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
    description: "任务状态：INIT、RUNNING、SUCCESS、IGNORED、FAILURE。IGNORED 为任务框架原生终态，"
                 "步骤发现目标态已满足（GSE 幂等错误码 828 重复启动 / 829 无需停止）时收敛，表示操作被幂等忽略"
  }];
  string message = 3 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = { description: "任务消息" }];
  string creator = 4 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = { description: "创建者" }];
  float execution_time = 5
      [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = { description: "执行时间(s)" }];
  TaskPayload task_payload = 6
      [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = { description: "进程配置快照" }];
  string compare_status = 7 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
    description: "对比状态：SAME、DIFFERENT、NEVER_PUBLISHED、UNKNOWN"
  }];
}

// TaskStatusStatItem 任务状态统计项
message TaskStatusStatItem {
  string status = 1 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
    description: "任务状态：INIT、RUNNING、SUCCESS、IGNORED、FAILURE（五类，IGNORED 为任务框架原生终态）"
  }];
  uint32 count = 2 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = { description: "数量" }];
  string message = 3 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = { description: "状态描述" }];
}

// Choice 查询枚举值选项
message Choice {
  string id = 1 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = { description: "选项ID" }];
  string name = 2 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = { description: "选项名称" }];
}

// FilterOptions 查询过滤选项
message FilterOptions {
  repeated Choice task_object_choices = 1
      [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = { description: "任务对象查询选项" }];
  repeated Choice task_action_choices = 2
      [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = { description: "任务动作查询选项" }];
  repeated Choice status_choices = 3
      [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = { description: "执行状态查询选项" }];
  repeated Choice executor_choices = 4
      [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = { description: "执行帐户查询选项" }];
}

// TaskDetailFilterOptions 任务详情过滤选项
message TaskDetailFilterOptions {
  repeated Choice set_name_choices = 1
      [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = { description: "集群名查询选项" }];
  repeated Choice module_name_choices = 2
      [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = { description: "模块名查询选项" }];
  repeated Choice service_name_choices = 3
      [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = { description: "服务名称查询选项" }];
  repeated Choice alias_choices = 4
      [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = { description: "进程别名查询选项" }];
  repeated Choice cc_process_id_choices = 5
      [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = { description: "CC进程ID查询选项" }];
  repeated Choice inst_id_choices = 6
      [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = { description: "实例ID查询选项" }];
}

// TaskStatisticsOverview 进程操作任务统计概览
message TaskStatisticsOverview {
  uint32 platform_bug_failed = 1 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
    description: "平台问题导致失败的实例数（依赖结构化错误码，未接入前固定为 0）"
  }];
  uint32 failed = 2 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = { description: "执行失败实例数" }];
  uint32 total = 3 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = { description: "执行实例总数" }];
  uint32 success = 4 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = { description: "成功实例数" }];
  uint32 ignored = 5 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = { description: "幂等忽略实例数" }];
  uint32 not_started = 6
      [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = { description: "未执行实例数" }];
  uint32 running = 7 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = { description: "运行中实例数" }];
  float failure_rate = 8
      [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = { description: "失败率（failed/total）" }];
}

// ChartItem 图表项，错误码分布 / 人员分布 / 业务分布共用
message ChartItem {
  string key = 1 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
    description: "下钻标识：错误码 / created_by / biz_id"
  }];
  string name = 2 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = { description: "展示名" }];
  uint32 value = 3 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = { description: "数量" }];
}

// FailureTaskItem 失败明细项
message FailureTaskItem {
  string task_id = 1 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = { description: "任务ID" }];
  string creator = 2 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = { description: "操作人" }];
  uint32 cc_process_id = 3 [
    (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = { description: "CC进程ID（取自任务 common_payload）" }
  ];
  string status = 4 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = { description: "执行状态" }];
  google.protobuf.Timestamp start = 5
      [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = { description: "开始时间" }];
  google.protobuf.Timestamp end = 6
      [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = { description: "结束时间" }];
  int32 error_code = 7 [
    (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = { description: "错误码，解析不到时为 0，前端展示 --" }
  ];
  string failed_reason = 8 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = { description: "失败原因" }];
  uint32 biz_id = 9 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = { description: "业务ID" }];
  string biz_name = 10
      [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = { description: "业务名称，CMDB 映射失败时为空" }];
  uint32 batch_id = 11 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = { description: "批次ID" }];
}

// TaskFailureFilterOptions 失败明细动态筛选选项。
// 选项按基础筛选条件（时间范围 + 创建人）过滤后的数据生成，不随扩展筛选条件变化，
// 避免用户选择某一维度后其他维度的可选项收缩。
message TaskFailureFilterOptions {
  repeated Choice task_ids = 1 [
    (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = { description: "任务ID选项，最多返回最新的 500 个" }
  ];
  repeated Choice creators = 2
      [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = { description: "创建人选项" }];
  repeated Choice statuses = 3
      [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = { description: "执行状态选项" }];
  repeated Choice biz_names = 4
      [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = { description: "业务名称选项" }];
  repeated Choice biz_ids = 5
      [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = { description: "业务ID选项" }];
  repeated Choice start_times = 6
      [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = { description: "开始时间选项，按天返回" }];
  repeated Choice end_times = 7
      [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = { description: "结束时间选项，按天返回" }];
  repeated Choice error_codes = 8 [
    (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = { description: "错误码选项，id 为 -- 表示无错误码" }
  ];
}
